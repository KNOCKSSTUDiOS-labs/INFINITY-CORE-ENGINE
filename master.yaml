Protection:
  PreserveOriginalFiles: true
  BlockAutoAdd: true
  BlockAutoDelete: true
  BlockAutoModify: true

  AllowChangesOnlyByCommand: true
  AuthorizedControllers:
    - "Claude LaSalle"
    - "Copilot"

  CommandRules:
    RequireExplicitUserCommand: true
    RequireUserPermissionForChanges: true
    AllowFixOnlyWhenUserCommands: true
    AllowUpdateOnlyWhenUserCommands: true
    AllowRenderOnlyWhenUserCommands: true

  NumPy:
    Enabled: true
    Mode: "3D-NUMPY"
    CanReadOriginal: true
    CannotModifyOriginal: true
    CannotAddToOriginal: true
    CannotDeleteOriginal: true
    OnlyModifyWhenUserCommands: true

  EngineIntegrity:
    ProtectInfinityCore: true
    ProtectDyabloGarden: true
    ProtectGICinema: true
    ProtectQuantumModules: true
    ProtectHTML: true
    ProtectCSS: true
    ProtectJS: true
    ProtectSQL: true
    ProtectSQLite: true
    ProtectJSON: true
    ProtectYAML: true

  Notes:
    - "No system may alter ANY original file unless the user explicitly commands it."
    - "AI agents may ONLY fix or update when the user gives a direct command."
    - "No auto-save, no auto-add, no auto-delete, no auto-modify."
    - "Original Infinity visuals, identity, and structure must remain untouched."
